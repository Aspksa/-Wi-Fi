name: Windows PowerShell compatibility
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax and BOM
        shell: powershell
        run: .\\tests\\PowerShellSyntax.Tests.ps1
      - name: Router telemetry safety
        shell: powershell
        run: .\\tests\\RouterTelemetry.Tests.ps1
      - name: Router identification and diagnostics
        shell: powershell
        run: .\\tests\\RouterDiscovery.Tests.ps1
      - name: Measured channel comparison tests
        shell: powershell
        run: .\\tests\\RouterDecision.Tests.ps1
      - name: V2.1 trend, router request and SQLite history
        shell: powershell
        run: .\\tests\\RouterInsights.Tests.ps1
      - name: Existing PowerShell regression tests
        shell: powershell
        run: |
          .\\tests\\ChannelWidth.Tests.ps1
          .\\tests\\Intelligence.Tests.ps1
          .\\tests\\NativeScan.Tests.ps1
          .\\tests\\WebState.Tests.ps1
      - name: Existing web tests
        shell: pwsh
        run: node --test tests/WebMap.test.cjs
